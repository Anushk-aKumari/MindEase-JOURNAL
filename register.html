<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - MindEase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="scripts/register.js" defer></script>
  <script type="module" src="scripts/nav.js" defer></script>
</head>
<body class="auth-page">
    <header>
    <a href="index.html" class="brand">MindEase</a>
    <nav>
      <a href="login.html" class="nav-btn">Login</a>
      <a href="register.html" class="nav-btn">Register</a>
      <button class="nav-btn logout-btn hidden" id="logoutBtn">Logout</button>
    </nav>
  </header>
  <div class="auth-container">
    <!-- Left Form Section -->
    <div class="auth-form">
      <h2>Create Your Account</h2>
      <p>Start your mindful journey with MindEase</p>
      <form id="registerForm">
        <input type="text" id="name" placeholder="Your name" required />
        <input type="email" id="email" placeholder="Email address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="primary-btn">Register</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
      <p id="registerError" class="auth-error hidden">Registration failed. Please try again.</p>
    </div>

    <!-- Right Illustration Section -->
    <div class="auth-image">
      <img src="images/login.png" alt="Register Illustration" />
    </div>
  </div>
</body>
</html>
