<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - MindEase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="scripts/login.js" defer></script>
  <script type="module" src="scripts/nav.js" defer></script>
</head>
<body class="auth-page">
    <header>
    <a href="index.html" class="brand">MindEase</a>
    <nav>
      <a href="login.html" class="nav-btn">Login</a>
      <a href="register.html" class="nav-btn">Register</a>
      <button class="nav-btn logout-btn hidden" id="logoutBtn">Logout</button>
    </nav>
  </header>
  <div class="auth-container">
    <!-- Left Form Section -->
    <div class="auth-form">
      <h2>Welcome Back</h2>
      <p>Login to continue journaling with MindEase</p>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="primary-btn">Login</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
      <p id="loginError" class="auth-error hidden">Invalid login. Please try again.</p>
    </div>

    <!-- Right Illustration Section -->
    <div class="auth-image">
      <img src="images/login.png" alt="MindEase login illustration" />
    </div>
  </div>
</body>
</html>
